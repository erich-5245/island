<!doctype html>
<!-- Source for site/og.png (the link preview image). Rebuild with tools/site/make-og.ps1 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500&family=Noto+Serif+TC:wght@900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(60% 80% at 75% 50%, #12284A 0%, #0A1730 70%);
    font-family: "Noto Sans TC", sans-serif; color: #E8E2D4;
    display: grid; grid-template-columns: 560px 1fr; align-items: center;
  }
  .text { padding-left: 80px; }
  .brand { display: flex; align-items: center; gap: 14px; color: #E2C79C; font-size: 26px; letter-spacing: .06em; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  h1 { margin: 30px 0 0; font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 64px; line-height: 1.25; color: #F3E6CF; white-space: nowrap; }
  p { margin: 26px 0 0; font-size: 24px; color: #94A3BC; }
  svg { width: 620px; height: auto; margin-left: -10px; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../site/assets/icon.png" alt="">Island</div>
    <h1>把桌面上的小事，<br>收進一座島。</h1>
    <p>給 Windows 的動態島 · 免費、開源</p>
  </div>
  <svg viewBox="0 0 600 380">
    <defs>
      <path id="leaf" d="M0 0 Q15 -7 30 0 Q15 7 0 0Z"/>
      <g id="palm">
        <use href="#leaf" fill="#A8854F" transform="rotate(17)"/><use href="#leaf" fill="#8A6B3D" transform="rotate(77)"/>
        <use href="#leaf" fill="#A8854F" transform="rotate(137)"/><use href="#leaf" fill="#8A6B3D" transform="rotate(197)"/>
        <use href="#leaf" fill="#A8854F" transform="rotate(257)"/><use href="#leaf" fill="#8A6B3D" transform="rotate(317)"/>
        <circle r="4" fill="#6E5230"/>
      </g>
      <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2C79C"/><stop offset="1" stop-color="#C9A774"/></linearGradient>
      <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C3D66"/><stop offset="1" stop-color="#15304F"/></linearGradient>
    </defs>
    <rect x="36" y="46" width="528" height="288" rx="144" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="2"/>
    <rect x="58" y="68" width="484" height="244" rx="122" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2"/>
    <rect x="80" y="90" width="440" height="200" rx="100" fill="url(#s)"/>
    <rect x="110" y="120" width="380" height="140" rx="70" fill="url(#l)" stroke="rgba(10,23,48,.4)" stroke-width="2"/>
    <line x1="300" y1="190" x2="356" y2="190" stroke="#F3E6CF" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="362" y="183" width="44" height="14" rx="7" fill="#F3E6CF"/>
    <g transform="translate(142 146) rotate(-4)"><use href="#palm" transform="scale(1.75)"/></g>
    <g transform="translate(190 254) rotate(5)"><use href="#palm" transform="scale(1.1)"/></g>
  </svg>
</body>
</html>
